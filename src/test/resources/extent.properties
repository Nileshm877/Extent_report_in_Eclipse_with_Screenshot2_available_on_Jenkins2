extent.reporter.spark.start=true
extent.reporter.spark.out=target/ExtentReport/ExtentReport.html
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

extent.reporter.spark.base64imagesrc=true
extent.reporter.spark.embed.css=true
extent.reporter.spark.embed.js=true

screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/

systeminfo.user=Automation_Jenkins
systeminfo.os=Linux
systeminfo.browser=Chrome_Headless
systeminfo.Framework=Selenium BDD Cucumber with Extent Report

# Timestamp format for reports
extent.reporter.spark.timelineenabled=true

